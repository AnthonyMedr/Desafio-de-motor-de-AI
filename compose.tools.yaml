name: desafio-tools

services:
  tools:
    image: desafio-tools:latest
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_PATH: /tmp/atendimento.sqlite
      TENANTS_DIR: /app/tenants
    volumes:
      - ./reports:/app/reports
    init: true
